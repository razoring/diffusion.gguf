<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161b26" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="960" height="240" fill="#0b0e14"/>
  <rect width="960" height="240" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="958" height="238" fill="none" stroke="#1b2230" stroke-width="1.5"/>

  <!-- Corner Brackets (Terminal Coder Feel) -->
  <path d="M 16 28 L 16 16 L 28 16" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 944 28 L 944 16 L 932 16" stroke="#1b2230" stroke-width="2" fill="none"/>
  <path d="M 16 212 L 16 224 L 28 224" stroke="#1b2230" stroke-width="2" fill="none"/>
  <path d="M 944 212 L 944 224 L 932 224" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <g transform="translate(68, 62)">
    <!-- Geometric Diffusion Symbol -->
    <g transform="translate(0, 10)">
      <!-- Upper Polygon (Autoregressive Anchor) -->
      <path d="M 38 0 L 78 0 L 40 52 L 0 52 Z" fill="url(#whiteGrad)"/>
      <!-- Lower Polygon (Diffusion Refinement Wave) -->
      <path d="M 52 44 L 92 44 L 54 96 L 14 96 Z" fill="url(#cyanGrad)" filter="url(#cyanGlow)" opacity="0.95"/>
      <!-- Small trailing pulse accent -->
      <polygon points="82,82 98,82 88,96 72,96" fill="#00f0ff" opacity="0.4"/>
    </g>

    <!-- Typography Group -->
    <g transform="translate(132, 54)">
      <!-- Wordmark -->
      <text font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace" font-size="52" font-weight="700" letter-spacing="-1.5">
        <tspan fill="#ffffff">diffusion</tspan>
        <tspan fill="#00f0ff" filter="url(#cyanGlow)">.gguf</tspan>
      </text>

      <!-- Subtitle & Specs -->
      <text y="34" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#718096" letter-spacing="3.2">
        EXACT PARALLEL TOKEN DIFFUSION ON AR WEIGHTS
      </text>
    </g>
  </g>

  <!-- Status / Pill Badges -->
  <g transform="translate(620, 158)">
    <rect x="0" y="0" width="136" height="24" rx="4" fill="#121824" stroke="#1f293d" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#00f0ff"/>
    <text x="24" y="15.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="1">B=1 EXACT AR</text>

    <rect x="146" y="0" width="124" height="24" rx="4" fill="#121824" stroke="#1f293d" stroke-width="1"/>
    <circle cx="158" cy="12" r="3.5" fill="#10b981"/>
    <text x="170" y="15.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="1">MULTI-GPU</text>
  </g>
</svg>
